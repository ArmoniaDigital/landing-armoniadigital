<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página no encontrada | Armonía Digital</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#ff5b00" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
        background: #ffffff;
        color: #101014;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        text-align: center;
      }
      .wrap {
        max-width: 560px;
      }
      .code {
        font-size: clamp(64px, 16vw, 120px);
        line-height: 1;
        font-weight: 800;
        letter-spacing: -0.04em;
        color: #ff5b00;
        margin: 0 0 8px;
      }
      h1 {
        font-size: clamp(22px, 5vw, 32px);
        margin: 0 0 12px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 28px;
        font-size: 16px;
        line-height: 1.6;
        color: #4b4b55;
      }
      nav {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      a {
        display: inline-block;
        padding: 12px 22px;
        border-radius: 999px;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        transition: transform 0.15s ease, background 0.15s ease;
      }
      a.primary {
        background: #ff5b00;
        color: #ffffff;
      }
      a.primary:hover {
        background: #e64f00;
      }
      a.ghost {
        background: #f2f2f5;
        color: #101014;
      }
      a.ghost:hover {
        background: #e6e6ec;
      }
      a:focus-visible {
        outline: 3px solid #ff5b00;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <p class="code">404</p>
      <h1>Esta página no existe</h1>
      <p>
        Puede que el enlace esté roto o que la dirección esté mal escrita. Vuelve al inicio o
        explora los artículos del blog.
      </p>
      <nav>
        <a class="primary" href="/">Ir al inicio</a>
        <a class="ghost" href="/blog">Ver el blog</a>
      </nav>
    </main>
  </body>
</html>
